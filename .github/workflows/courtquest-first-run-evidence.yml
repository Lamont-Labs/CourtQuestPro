name: CourtQuest first-run visual comparison

on:
  push:
    branches: [qa/premium-first-run-evidence]

permissions:
  actions: read
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Check out the evidence driver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch exact baseline and candidate APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p visual-evidence
          gh run download 42569656876 --name CourtQuestPro-build-validation-55 --dir apk-input/baseline
          gh run download 42901658452 --name courtquest-dev-verification --dir apk-input/candidate
          printf 'baseline=%s\ncandidate=%s\n' d3eca51e4f6b915e753e3f1efd65d0a51bd24292 929d42f6b71b29473fe4ebc872f96317e616c831 > visual-evidence/source-revisions.txt
      - name: Enable hosted emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          fi
      - name: Capture and exercise the first-run flow
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -cores 4 -memory 4096
          script: python3 scripts/verify_premium_first_run.py
      - name: Retain actual Android renders and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: courtquest-first-run-android-evidence
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14
