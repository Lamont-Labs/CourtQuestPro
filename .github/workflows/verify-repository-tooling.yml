name: Verify repository tooling
on:
  push:
    branches: [dev/premium-daily-flow]
    paths: ['.github/workflows/verify-repository-tooling.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify repository tests
        run: python3 -m unittest discover -s tests -v
