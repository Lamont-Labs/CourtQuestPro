name: Verify Android walkthrough

on:
  push:
    branches: [dev/v42-solo-first-batch]
    paths:
      - '.github/workflows/verify-navigation-walkthrough.yml'
      - 'app/build.gradle.kts'
      - 'app/src/**'
      - 'scripts/verify_android_walkthrough.py'
      - 'scripts/verify_phone_update.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: courtquest-walkthrough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android 35 SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.1" \
            "system-images;android-35;default;x86_64" emulator
      - name: Build candidate and test APK, run unit tests and lint
        run: |
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest \
            :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Exercise the installed walkthrough and v47 upgrade
        env:
          ANDROID_AVD_HOME: /tmp/courtquest-walkthrough-avd
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME" artifacts/walkthrough
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/CourtQuestPro-Update-v47.apk" \
            https://github.com/Lamont-Labs/CourtQuestPro/releases/download/courtquest-phone-update-v47/CourtQuestPro-Update-v47.apk
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd \
            --name CourtQuest_PremiumQA --package 'system-images;android-35;default;x86_64' \
            --device pixel_2 --path "$ANDROID_AVD_HOME/CourtQuest_PremiumQA.avd"
          "${ANDROID_HOME}/emulator/emulator" -avd CourtQuest_PremiumQA -port 5562 \
            -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect \
            -accel on -cores 2 -memory 2048 > artifacts/walkthrough/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          adb="${ANDROID_HOME}/platform-tools/adb"
          timeout 180 "$adb" -s emulator-5562 wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$("$adb" -s emulator-5562 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$("$adb" -s emulator-5562 shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$adb" -s emulator-5562 shell input keyevent 82
          python3 -u scripts/verify_android_walkthrough.py \
            --previous "$RUNNER_TEMP/CourtQuestPro-Update-v47.apk" \
            --candidate app/build/outputs/apk/debug/app-debug.apk \
            --instrumentation app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --output artifacts/walkthrough
          test -s artifacts/walkthrough/compose-ui-test.txt
      - name: Upload native screenshots and test results for visual review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: courtquest-walkthrough-native
          path: |
            artifacts/walkthrough/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 30
