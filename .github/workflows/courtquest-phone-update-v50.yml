name: CourtQuest Pro Jersey Studio phone-test APK v50
on:
  push:
    branches: [dev/full-overhaul-jersey]
    paths:
      - '.github/workflows/courtquest-phone-update-v50.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
concurrency:
  group: courtquest-phone-update-v50-jersey
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Lamont-Labs/CourtQuestPro' && github.ref == 'refs/heads/dev/full-overhaul-jersey'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ANDROID_AVD_HOME: /tmp/courtquest-avd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enforce source identity and immutable release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          assert os.environ['GITHUB_REF']=='refs/heads/dev/full-overhaul-jersey'
          assert 'versionCode = 50' in Path('app/build.gradle.kts').read_text()
          assert 'applicationId = "com.courtquestpro"' in Path('app/build.gradle.kts').read_text()
          assert subprocess.run(['git','merge-base','--is-ancestor','7bd14e8a93e8b501a7c1491a58d5eabab88ca7e5','HEAD']).returncode==0
          PY
          python3 -m unittest discover -s scripts -p 'test_android_flow_*.py'
      - name: Compile, test and lint candidate
        run: |
          chmod +x gradlew
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
          python3 -m pip install 'Pillow==11.3.0'
          python3 scripts/verify_drill_artwork.py --check
          python3 -m unittest scripts.test_drill_artwork
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify previous release and exact APK identity
        run: |
          set -euo pipefail
          mkdir -p previous dist
          gh release download courtquest-phone-update-v49 --pattern 'CourtQuestPro-Update-v49.apk' --pattern 'CourtQuestPro-Update-v49.apk.sha256' --dir previous
          (cd previous && sha256sum --check CourtQuestPro-Update-v49.apk.sha256)
          python3 scripts/verify_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --build-tools "${ANDROID_HOME}/build-tools/35.0.1" --output dist
          python3 scripts/verify_phone_update.py identity --previous previous/CourtQuestPro-Update-v49.apk --candidate app/build/outputs/apk/debug/app-debug.apk --previous-version 49 --candidate-version 50 --tools "${ANDROID_HOME}/build-tools/35.0.1" --output dist
      - name: Prepare one disposable upgrade emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;default;x86_64' emulator
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --name CourtQuest_PremiumQA --package 'system-images;android-35;default;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/CourtQuest_PremiumQA.avd"
          "${ANDROID_HOME}/emulator/emulator" -avd CourtQuest_PremiumQA -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 > dist/emulator.log 2>&1 &
          python3 - <<'PY'
          import subprocess,sys,time
          sys.path.insert(0,'scripts')
          import verify_android_daily_flow as ui
          for _ in range(120):
              try:
                  if ui.shell('getprop','sys.boot_completed',timeout=8)=='1':break
              except (RuntimeError,subprocess.TimeoutExpired):pass
              time.sleep(3)
          else:raise RuntimeError('Disposable QA emulator did not boot')
          ui.shell('input','keyevent','KEYCODE_WAKEUP')
          ui.shell('wm','dismiss-keyguard')
          PY
      - name: Verify v49-to-v50 upgrade preserves saved player data
        run: |
          python3 scripts/verify_phone_update.py upgrade --previous previous/CourtQuestPro-Update-v49.apk --candidate app/build/outputs/apk/debug/app-debug.apk --previous-version 49 --candidate-version 50 --output dist
      - name: Exercise Studio, walkthrough and training on the exact candidate
        run: |
          set -euo pipefail
          adb=( "${ANDROID_HOME}/platform-tools/adb" -s emulator-5562 )
          "${adb[@]}" install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          pkg=com.courtquestpro
          runner="$pkg.test/androidx.test.runner.AndroidJUnitRunner"
          test "$("${adb[@]}" shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          test "$("${adb[@]}" emu avd name | head -n 1 | tr -d '\r')" = CourtQuest_PremiumQA
          "${adb[@]}" shell settings put global animator_duration_scale 0
          "${adb[@]}" shell wm density 320
          for config in 'normal 720x1440 1.0' 'compact 640x1280 1.3' 'large 640x1280 2.0'; do
            read -r label size scale <<< "$config"
            mkdir -p "dist/$label"
            "${adb[@]}" shell wm size "$size"
            "${adb[@]}" shell settings put system font_scale "$scale"
            if [ "$label" != normal ]; then "${adb[@]}" shell pm clear "$pkg"; fi
            "${adb[@]}" shell am instrument -w -e class "$pkg.JerseyStudioTest#customizationRestoresAcrossRecreationAndReturnsToCourt" "$runner" | tee "dist/$label/studio.txt"
            grep -F 'OK (1 test)' "dist/$label/studio.txt"
            for capture in jersey-studio-front jersey-studio-back jersey-court; do
              "${adb[@]}" exec-out run-as "$pkg" cat "files/$capture.png" > "dist/$label/$capture.png"
              test -s "dist/$label/$capture.png"
            done
            "${adb[@]}" shell am force-stop "$pkg"
            "${adb[@]}" shell am instrument -w -e class "$pkg.JerseyStudioTest#coldStartRestoresPreviouslySavedJersey" "$runner" | tee "dist/$label/studio-cold-start.txt"
            grep -F 'OK (1 test)' "dist/$label/studio-cold-start.txt"
            "${adb[@]}" shell am instrument -w -e class "$pkg.NavigationTourTest" "$runner" | tee "dist/$label/walkthrough.txt"
            grep -F 'OK (1 test)' "dist/$label/walkthrough.txt"
          done
          "${adb[@]}" shell wm size 720x1440
          "${adb[@]}" shell settings put system font_scale 1.0
          "${adb[@]}" shell pm clear "$pkg"
          "${adb[@]}" shell am instrument -w -e class "$pkg.TrainingEntryTest" "$runner" | tee dist/training.txt
          grep -F 'OK (1 test)' dist/training.txt
      - name: Seal exact binary and publish immutable prerelease
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk dist/CourtQuestPro-Update-v50.apk
          (cd dist && sha256sum CourtQuestPro-Update-v50.apk > CourtQuestPro-Update-v50.apk.sha256 && sha256sum --check CourtQuestPro-Update-v50.apk.sha256)
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('dist')
          apk=root/'CourtQuestPro-Update-v50.apk'
          manifest=json.loads((root/'apk-manifest.json').read_text())
          identity=json.loads((root/'upgrade-identity.json').read_text())
          upgrade=json.loads((root/'install-upgrade.json').read_text())
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert manifest['package_id']=='com.courtquestpro' and manifest['version_code']==50
          assert manifest['apk_sha256']==digest
          assert identity['candidate']['apk_sha256']==digest
          assert identity['previous']['certificate_sha256']==identity['candidate']['certificate_sha256']
          assert upgrade['versions']==[49,50] and upgrade['input_apk_sha256']==digest
          assert upgrade['android_install_replace'] and upgrade['preferences_byte_identical_after_install']
          assert upgrade['saved_values_preserved_after_launch'] and upgrade['saved_values_preserved_after_relaunch']
          assert upgrade['destructive_phone_operations']=='NONE'
          manifest.update(source_commit=os.environ['GITHUB_SHA'],release_tag='courtquest-phone-update-v50',upgrade_identity=identity,install_upgrade=upgrade)
          manifest['checks']['emulator_test'] = 'PASS_V49_UPGRADE_STUDIO_WALKTHROUGH_TRAINING'
          (root/'apk-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (root/'RELEASE_NOTES.md').write_text('# CourtQuest Pro v50 phone-test APK\n\nIncludes the Jersey Studio, Court, Drill Library, training, profile, and game updates from v49. On Android, the Studio Back arrow is now bright and the front/back controls remain compact at large text sizes. Shorter contrast warnings leave more room for editing. The phone-test APK upgraded the published v49 build and preserved player data on an Android emulator. Install over the current app to retain saved data. Physical phone review is pending.\n')
          PY
          if gh api "repos/${GH_REPO}/releases/tags/courtquest-phone-update-v50" >/dev/null 2>&1; then echo 'v50 already published; refusing overwrite'; exit 1; fi
          gh release create courtquest-phone-update-v50 dist/CourtQuestPro-Update-v50.apk dist/CourtQuestPro-Update-v50.apk.sha256 dist/apk-manifest.json dist/upgrade-identity.json dist/install-upgrade.json dist/RELEASE_NOTES.md --target "$GITHUB_SHA" --prerelease --latest=false --title 'CourtQuest Pro v50 — Jersey Studio phone test' --notes-file dist/RELEASE_NOTES.md
          mkdir -p /tmp/courtquest-published
          gh release download courtquest-phone-update-v50 --pattern 'CourtQuestPro-Update-v50.apk' --dir /tmp/courtquest-published
          cmp dist/CourtQuestPro-Update-v50.apk /tmp/courtquest-published/CourtQuestPro-Update-v50.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courtquest-v50-jersey-release-evidence
          path: |
            dist/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 30
          if-no-files-found: warn

# v50 phone-test release; preserve app identity and player data.
