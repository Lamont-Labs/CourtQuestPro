name: Publish authorized CourtQuest development APK

on:
  push:
    branches: [dev/scorekeeper-undo-history]
    paths: ['release-request/courtquest-dev.txt']

permissions:
  contents: write
  actions: read

concurrency:
  group: courtquest-authorized-development-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned APK verification tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.1"
      - name: Retrieve the successful Android-tested binary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run_id=$(python3 -c "import json; print(json.load(open('release-request/courtquest-dev-evidence.json'))['native_run_id'])")
          [[ "$run_id" =~ ^[0-9]+$ ]]
          gh api "repos/${GH_REPO}/actions/runs/${run_id}" > native-run.json
          python3 - <<'PY'
          import json
          request = json.load(open('release-request/courtquest-dev-evidence.json'))
          run = json.load(open('native-run.json'))
          assert run['conclusion'] == 'success' and run['status'] == 'completed'
          assert run['head_sha'] == request['native_commit']
          assert run['head_branch'] == 'dev/premium-flow-toolkit'
          assert run['path'] == '.github/workflows/verify-native-library-flow.yml'
          PY
          gh run download "$run_id" --name courtquest-native-library-flow --dir native-evidence
      - name: Verify source, tests, native journeys and APK identity
        run: |
          python3 scripts/verify_apk.py --apk native-evidence/app/build/outputs/apk/debug/app-debug.apk --build-tools "${ANDROID_HOME}/build-tools/35.0.1" --output dist
          python3 - <<'PY'
          import json, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          request = json.load(open('release-request/courtquest-dev-evidence.json'))
          root = Path('native-evidence')
          revisions = (root / 'artifacts/source-revisions.txt').read_text().splitlines()
          assert revisions[0] == request['native_commit']
          assert revisions[1] == request['app_src_tree'] == subprocess.check_output(['git', 'rev-parse', 'HEAD:app/src'], text=True).strip()
          daily = json.loads((root / 'artifacts/android-daily-flow/candidate-result.json').read_text())
          game = json.loads((root / 'artifacts/android-daily-flow/game-result.json').read_text())
          library = json.loads((root / 'artifacts/android-daily-flow/library-result.json').read_text())
          assert all(value for value in library.values() if isinstance(value, bool))
          manifest = json.loads(Path('dist/apk-manifest.json').read_text())
          assert manifest['version_code'] == daily['version_code'] == request['version_code'] == 7
          assert manifest['apk_sha256'] == request['apk_sha256'] == daily['input_apk_sha256'] == game['input_apk_sha256'] == library['input_apk_sha256']
          assert manifest['certificate_sha256'] == request['certificate_sha256']
          assert manifest['package_id'] == request['package_id']
          assert manifest['apk_size_bytes'] == request['apk_size_bytes']
          assert all(value for value in daily.values() if isinstance(value, bool))
          assert all(value for value in game.values() if isinstance(value, bool))
          suites = [ET.parse(p).getroot() for p in (root / 'app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          count = sum(int(s.get('tests')) for s in suites)
          assert count >= 48
          assert not sum(int(s.get('failures')) + int(s.get('errors')) + int(s.get('skipped')) for s in suites)
          issues = ET.parse(root / 'app/build/reports/lint-results-debug.xml').getroot().findall('issue')
          errors = sum(i.get('severity') == 'Error' for i in issues)
          warnings = sum(i.get('severity') == 'Warning' for i in issues)
          assert errors == 0
          smoke = ET.parse(root / 'artifacts/premium-flow-toolkit/report.xml').getroot()
          smoke_suites = [smoke] if smoke.tag == 'testsuite' else list(smoke.iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in smoke_suites) >= 1
          assert not sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) + int(s.get('skipped', 0)) for s in smoke_suites)
          manifest.update(maestro_smoke='PASS', native_run_id=request['native_run_id'], native_commit=request['native_commit'], android_unit_tests=count, lint_errors=errors, lint_warnings=warnings, daily_flow=daily, game_flow=game, library_flow=library)
          manifest['checks']['emulator_test'] = 'PASS_SAME_APK_SHA256'
          Path('dist/apk-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          notes = ['CourtQuest Pro — Signature training build 7', '',
            'Deep black, brighter orange and polished smoked glass through Court, training, saved receipts and Progress. Clean Signature branding, a shared header/navigation, a named next drill, and a fixed result action area. Preserves custom drills, protected shuffle, extra practice, game scoring, Undo and existing saves.', '',
            f"Version: {manifest['version_name']} ({manifest['version_code']})", f"Package: {manifest['package_id']}",
            f"SHA-256: {manifest['apk_sha256']}", f"Certificate SHA-256: {manifest['certificate_sha256']}",
            f'Android unit tests: {count} passed. Lint: {errors} errors, {warnings} warnings.',
            f"Native source: {request['native_commit']}", f"Android evidence: https://github.com/Lamont-Labs/CourtQuestPro/actions/runs/{request['native_run_id']}", '',
            'The APK is the exact binary exercised on Android. The original package and development signer are preserved.',
            'Emulator captures use synthetic profiles. Owner visual acceptance, physical-phone operation and full TalkBack traversal remain separate.']
          Path('dist/current-release.md').write_text('\n'.join(notes) + '\n')
          print(json.dumps(manifest, sort_keys=True))
          PY
          cp native-evidence/app/build/outputs/apk/debug/app-debug.apk dist/CourtQuestPro-Android-debug.apk
          sha256sum dist/CourtQuestPro-Android-debug.apk > dist/CourtQuestPro-Android-debug.apk.sha256
      - name: Publish and verify the downloaded development update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload courtquest-dev-2026-11-05 dist/CourtQuestPro-Android-debug.apk dist/CourtQuestPro-Android-debug.apk.sha256 --clobber
          mkdir -p downloaded/dist
          gh release download courtquest-dev-2026-11-05 --pattern 'CourtQuestPro-Android-debug.apk*' --dir downloaded/dist --clobber
          (cd downloaded && sha256sum --check dist/CourtQuestPro-Android-debug.apk.sha256)
          cmp dist/CourtQuestPro-Android-debug.apk downloaded/dist/CourtQuestPro-Android-debug.apk
          python3 scripts/verify_apk.py --apk downloaded/dist/CourtQuestPro-Android-debug.apk --build-tools "${ANDROID_HOME}/build-tools/35.0.1" --output downloaded/verified
          for spec in 'court:Court' 'drill:Drill' 'result:Result' 'progress-after-save:Progress' 'compact-court:CompactCourt' 'large-type-drill:LargeTypeDrill'; do
            stem=${spec%:*}
            label=${spec#*:}
            cp "native-evidence/artifacts/android-daily-flow/candidate-${stem}.png" "dist/CourtQuestPro-Build7-${label}.png"
          done
          gh release upload courtquest-dev-2026-11-05 dist/CourtQuestPro-Build7-*.png --clobber
          gh release edit courtquest-dev-2026-11-05 --title 'CourtQuest Pro — Signature training build 7' --notes-file dist/current-release.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courtquest-published-build-verification
          path: |
            dist/apk-manifest.json
            dist/current-release.md
            downloaded/verified/*.json
            downloaded/verified/*.txt
          if-no-files-found: warn
          retention-days: 30
