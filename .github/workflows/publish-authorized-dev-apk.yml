name: Publish authorized CourtQuest development APK

on:
  push:
    branches: [dev/scorekeeper-undo-history]
    paths:
      - 'release-request/courtquest-dev.txt'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1"
      - name: Build and test authorized APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Verify and stage installable APK
        run: |
          mkdir -p dist
          test -s app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.1/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee dist/apk-badging.txt
          grep -q "package: name='com.courtquestpro'" dist/apk-badging.txt
          "${ANDROID_HOME}/build-tools/35.0.1/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/CourtQuestPro-Android-debug.apk
          sha256sum dist/CourtQuestPro-Android-debug.apk > dist/CourtQuestPro-Android-debug.apk.sha256
      - name: Publish explicit authorized development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create courtquest-dev-2026-11-05 dist/CourtQuestPro-Android-debug.apk dist/CourtQuestPro-Android-debug.apk.sha256 --target "${GITHUB_SHA}" --title "CourtQuest Pro — Android development APK (2026-11-05)" --notes "Installable Android debug APK. Development/testing build; not Play Store signed. Includes training results, trends, completion gates, and draft recovery. Generated from the development branch; no merge to main." --prerelease
