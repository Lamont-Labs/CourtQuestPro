name: Premium flow toolkit checks

on:
  push:
    branches: [dev/premium-flow-toolkit, dev/edge-navigation-v1]
  pull_request:
    branches: [dev/premium-flow-toolkit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android build packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
      - name: Verify source configuration
        run: |
          python3 -m json.tool tools/premium-flow/references.lock.json > /dev/null
          bash -n scripts/install_maestro.sh scripts/run_premium_flow_checks.sh
      - name: Build, unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          ./gradlew --no-daemon --console=plain :app:dependencies --configuration debugRuntimeClasspath > dependency-resolution.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Maestro
        run: bash scripts/install_maestro.sh
      - name: Allow emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run dedicated-emulator journey
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          arch: x86_64
          target: default
          avd-name: CourtQuest_PremiumQA
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -cores 2 -memory 2048
          script: bash scripts/run_premium_flow_checks.sh emulator-5554 app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courtquest-premium-flow-toolkit
          path: |
            artifacts/premium-flow-toolkit/
            .maestro/tests/
            dependency-resolution.txt
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
