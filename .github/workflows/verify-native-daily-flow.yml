name: Verify native daily flow

on:
  push:
    branches: [dev/premium-daily-flow]
    paths:
      - 'app/**'
      - 'scripts/verify_android_daily_flow.py'
      - '.github/workflows/verify-native-daily-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COURTQUEST_VERSION_CODE: '3'
      COURTQUEST_UI_EVIDENCE: artifacts/android-daily-flow
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the candidate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Prepare Android emulator and preserved build 2
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "${ANDROID_HOME}/emulator/emulator" -accel-check
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1' 'system-images;android-35;default;x86_64' 'emulator'
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --name CourtQuest_Visual --package 'system-images;android-35;default;x86_64' --device pixel_2
          curl --fail --location --retry 3 'https://github.com/Lamont-Labs/CourtQuestPro/releases/download/courtquest-dev-2026-11-05/CourtQuestPro-Android-debug.apk' -o /tmp/courtquest-build2.apk
          printf 'b4b9b218b932d3bf97fe6b66cfbb2687535da9b840621dae1d5be6e3099edee2  /tmp/courtquest-build2.apk\n' | sha256sum --check
      - name: Capture baseline, update in place, and verify the daily flow
        run: |
          mkdir -p "$COURTQUEST_UI_EVIDENCE"
          "${ANDROID_HOME}/platform-tools/adb" start-server
          "${ANDROID_HOME}/emulator/emulator" -avd CourtQuest_Visual -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 > "$COURTQUEST_UI_EVIDENCE/emulator.log" 2>&1 &
          export COURTQUEST_EMULATOR_PID=$!
          sleep 10
          if ! kill -0 "$COURTQUEST_EMULATOR_PID"; then cat "$COURTQUEST_UI_EVIDENCE/emulator.log"; exit 1; fi
          python3 -u scripts/verify_android_daily_flow.py baseline /tmp/courtquest-build2.apk
          python3 -u scripts/verify_android_daily_flow.py candidate app/build/outputs/apk/debug/app-debug.apk
      - name: Capture Android diagnostics
        if: always()
        run: |
          mkdir -p "$COURTQUEST_UI_EVIDENCE"
          timeout 30 "${ANDROID_HOME}/platform-tools/adb" -s emulator-5562 logcat -d > "$COURTQUEST_UI_EVIDENCE/logcat.txt" 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courtquest-native-daily-flow
          path: |
            artifacts/android-daily-flow/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
