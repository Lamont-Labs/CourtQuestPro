name: Jersey Studio candidate and emulator evidence
on:
  push:
    branches: [dev/jersey-material-studio, dev/jersey-reference-studio, dev/player-card-profile-v2]
    paths:
      - '.github/workflows/jersey-material-candidate.yml'
      - 'app/build.gradle.kts'
      - 'app/src/**'
      - 'tools/jersey/**'
      - 'tools/player-card/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jersey-material-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ANDROID_AVD_HOME: /tmp/courtquest-jersey-avd
      CANDIDATE_APK: ${{ github.ref_name == 'dev/player-card-profile-v2' && 'CourtQuestPro-PlayerCard-V2-v57-RC.apk' || 'CourtQuestPro-JerseyStudio-v57-RC.apk' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the APK and run unit tests and lint
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
          if [[ "$GITHUB_REF_NAME" == "dev/player-card-profile-v2" ]]; then
            python3 -m pip install 'Pillow==11.3.0'
            python3 tools/player-card/build_assets.py --check
          fi
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Compare the published v56 APK and the signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous evidence candidate
          gh release download courtquest-phone-update-v56 -R "$GITHUB_REPOSITORY" --pattern 'CourtQuestPro-Update-v56.apk*' --dir previous
          (cd previous && sha256sum -c CourtQuestPro-Update-v56.apk.sha256)
          cp app/build/outputs/apk/debug/app-debug.apk "candidate/$CANDIDATE_APK"
          python3 scripts/verify_apk.py --apk "candidate/$CANDIDATE_APK" --build-tools "$ANDROID_HOME/build-tools/35.0.1" --output evidence
          python3 scripts/verify_phone_update.py identity --previous previous/CourtQuestPro-Update-v56.apk --candidate "candidate/$CANDIDATE_APK" --previous-version 56 --candidate-version 57 --tools "$ANDROID_HOME/build-tools/35.0.1" --output evidence
          # The shared verifier also stages phone-release files. Keep candidate transport separate from evidence.
          rm evidence/CourtQuestPro-1.0.apk evidence/SHA256SUMS.txt evidence/RELEASE_NOTES.md
          git rev-parse HEAD > evidence/commit.txt
      - name: Boot the disposable Android 35 emulator
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;default;x86_64' emulator
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name CourtQuest_PremiumQA --package 'system-images;android-35;default;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/CourtQuest_PremiumQA.avd"
          "$ANDROID_HOME/emulator/emulator" -avd CourtQuest_PremiumQA -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 > evidence/emulator.log 2>&1 &
      - name: Download the exact verified original card baseline
        if: github.ref_name == 'dev/player-card-profile-v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 44612071475 --json headSha --jq .headSha)" = "6537a9447968ecaa6d50cf5965a1d4bfa7bb6a9b"
          test "$(gh run view 44612071475 --json conclusion --jq .conclusion)" = "success"
          gh run download 44612071475 --name CourtQuestPro-JerseyStudio-v57-RC --dir baseline
          (cd baseline && sha256sum -c CourtQuestPro-JerseyStudio-v57-RC.apk.sha256)
      - name: Exercise migration, live printing, persistence and frame timing on the candidate
        if: github.ref_name != 'dev/player-card-profile-v2'
        run: |
          python3 tools/jersey/verify_device.py --previous previous/CourtQuestPro-Update-v56.apk --candidate "candidate/$CANDIDATE_APK" --instrumentation app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --out evidence
          python3 -m pip install 'Pillow==11.3.0'
          python3 tools/jersey/comparison.py evidence/normal evidence/JerseyStudio-Comparison.png
          (cd candidate && sha256sum *.apk > "$CANDIDATE_APK.sha256")
      - name: Verify collectible cards, live uniforms, persistence and existing native flows
        if: github.ref_name == 'dev/player-card-profile-v2'
        run: |
          python3 tools/player-card/verify_device.py --previous previous/CourtQuestPro-Update-v56.apk --baseline baseline/CourtQuestPro-JerseyStudio-v57-RC.apk --candidate "candidate/$CANDIDATE_APK" --instrumentation app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --out evidence
          (cd candidate && sha256sum *.apk > "$CANDIDATE_APK.sha256")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jersey-studio-emulator-evidence
          path: |
            evidence/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-debug.xml
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ github.ref_name == 'dev/player-card-profile-v2' && 'CourtQuestPro-PlayerCard-V2-v57-RC' || 'CourtQuestPro-JerseyStudio-v57-RC' }}
          path: candidate/
          retention-days: 30
