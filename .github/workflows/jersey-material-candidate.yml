name: Jersey Studio candidate and emulator evidence
on:
  push:
    branches: [dev/jersey-material-studio]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jersey-material-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ANDROID_AVD_HOME: /tmp/courtquest-jersey-avd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build the APK and run unit tests and lint
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Compare the published v56 APK and the signed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous evidence candidate
          gh release download courtquest-phone-update-v56 -R "$GITHUB_REPOSITORY" --pattern 'CourtQuestPro-Update-v56.apk*' --dir previous
          (cd previous && sha256sum -c CourtQuestPro-Update-v56.apk.sha256)
          cp app/build/outputs/apk/debug/app-debug.apk candidate/CourtQuestPro-JerseyStudio-v57-RC.apk
          python3 scripts/verify_apk.py --apk candidate/CourtQuestPro-JerseyStudio-v57-RC.apk --build-tools "$ANDROID_HOME/build-tools/35.0.1" --output evidence
          python3 scripts/verify_phone_update.py identity --previous previous/CourtQuestPro-Update-v56.apk --candidate candidate/CourtQuestPro-JerseyStudio-v57-RC.apk --previous-version 56 --candidate-version 57 --tools "$ANDROID_HOME/build-tools/35.0.1" --output evidence
          git rev-parse HEAD > evidence/commit.txt
      - name: Boot the disposable Android 35 emulator
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;default;x86_64' emulator
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name CourtQuest_PremiumQA --package 'system-images;android-35;default;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/CourtQuest_PremiumQA.avd"
          "$ANDROID_HOME/emulator/emulator" -avd CourtQuest_PremiumQA -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 > evidence/emulator.log 2>&1 &
      - name: Exercise migration, live printing, persistence and frame timing on the candidate
        run: |
          python3 tools/jersey/verify_device.py --previous previous/CourtQuestPro-Update-v56.apk --candidate candidate/CourtQuestPro-JerseyStudio-v57-RC.apk --instrumentation app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk --out evidence
          python3 -m pip install 'Pillow==11.3.0'
          python3 tools/jersey/comparison.py evidence/normal evidence/JerseyStudio-Comparison.png
          (cd candidate && sha256sum *.apk > CourtQuestPro-JerseyStudio-v57-RC.apk.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jersey-studio-emulator-evidence
          path: |
            evidence/
            app/build/test-results/testDebugUnitTest/TEST-*.xml
            app/build/reports/lint-results-debug.xml
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CourtQuestPro-JerseyStudio-v57-RC
          path: candidate/
          retention-days: 30
