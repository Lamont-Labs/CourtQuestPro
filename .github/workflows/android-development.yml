name: Android development checks

on:
  push:
    branches:
      - 'dev/**'
      - 'fix/**'
      - '!dev/player-card-profile-v2'
      - 'integration/gpt-work-v48-review'
      - 'repair/premium-flow-stabilization'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate QA shell syntax
        run: bash -n scripts/run_multi_device_qa.sh
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1"
      - name: Verify complete offline drill artwork
        run: |
          python3 -m pip install 'Pillow==11.3.0'
          python3 scripts/verify_drill_artwork.py --check
          python3 -m unittest scripts.test_drill_artwork -v
      - name: Unit tests, APK compilation, and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Retain test results and debug APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: courtquest-dev-verification
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
