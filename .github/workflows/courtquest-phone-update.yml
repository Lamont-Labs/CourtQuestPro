name: CourtQuest in-place phone update

on:
  push:
    branches: [repair/premium-flow-stabilization]
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/courtquest-phone-update.yml'
      - 'scripts/phone_release_gate.py'
      - 'scripts/verify_phone_update.py'
      - 'scripts/test_android_flow_phone_update.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: courtquest-phone-update-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Lamont-Labs/CourtQuestPro' && github.ref == 'refs/heads/repair/premium-flow-stabilization'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ANDROID_AVD_HOME: /tmp/courtquest-avd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enforce verified source and preserve existing releases
        run: |
          set -euo pipefail
          python3 scripts/phone_release_gate.py source
          gh api "repos/${GH_REPO}/releases?per_page=100" > /tmp/releases.json
          python3 - <<'PY'
          import json
          assert not any(r['tag_name']=='courtquest-phone-update-v21' for r in json.load(open('/tmp/releases.json'))), 'v21 already exists; refusing to overwrite it'
          PY
          python3 -m unittest discover -s scripts -p 'test_android_flow_*.py' -v
      - name: Build v21 using the existing signing configuration
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.1'
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Cryptographically verify v21 against the actual v20 release
        run: |
          set -euo pipefail
          mkdir -p previous dist
          gh release download courtquest-phone-update-v20 --pattern 'CourtQuestPro-Update-v20.apk' --dir previous
          python3 scripts/verify_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --build-tools "${ANDROID_HOME}/build-tools/35.0.1" --output dist
          python3 scripts/verify_phone_update.py identity
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Test a real in-place v20 to v21 install on disposable Android
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;default;x86_64' emulator
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --name CourtQuest_PremiumQA --package 'system-images;android-35;default;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/CourtQuest_PremiumQA.avd"
          "${ANDROID_HOME}/emulator/emulator" -avd CourtQuest_PremiumQA -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 > dist/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import subprocess,sys,time
          sys.path.insert(0,'scripts')
          import verify_android_daily_flow as ui
          for _ in range(120):
              try:
                  if ui.shell('getprop','sys.boot_completed',timeout=8)=='1':break
              except (RuntimeError,subprocess.TimeoutExpired):pass
              time.sleep(3)
          else:raise RuntimeError('QA emulator did not boot')
          ui.shell('input','keyevent','KEYCODE_WAKEUP')
          ui.shell('wm','dismiss-keyguard')
          PY
          python3 scripts/verify_phone_update.py upgrade
      - name: Require passing native, drawer and development checks for this exact commit
        run: |
          set -euo pipefail
          python3 scripts/phone_release_gate.py ci
          run_id=$(python3 -c "import json;print(json.load(open('dist/ci-gates.json'))['verify-native-library-flow.yml']['id'])")
          gh run download "$run_id" --name courtquest-native-library-flow --dir native-evidence
          python3 scripts/verify_phone_update.py finalize
          cp app/build/outputs/apk/debug/app-debug.apk dist/CourtQuestPro-Update-v21.apk
          (cd dist && sha256sum CourtQuestPro-Update-v21.apk > CourtQuestPro-Update-v21.apk.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courtquest-v21-verification
          path: dist/
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: courtquest-v21-verification
          path: dist
      - name: Publish the immutable verified v21 binary without replacing any assets
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check CourtQuestPro-Update-v21.apk.sha256)
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path('dist/apk-manifest.json').read_text())
          assert manifest['version_code']==21 and manifest['package_id']=='com.courtquestpro'
          assert manifest['checks']['emulator_test']=='PASS_V20_TO_V21_IN_PLACE_AND_FULL_NATIVE_SAME_APK'
          assert manifest['apk_sha256']==hashlib.sha256(Path('dist/CourtQuestPro-Update-v21.apk').read_bytes()).hexdigest()
          assert all(r['status']=='completed' and r['conclusion']=='success' for r in manifest['exact_commit_ci'].values())
          PY
          gh release create courtquest-phone-update-v21 \
            dist/CourtQuestPro-Update-v21.apk dist/CourtQuestPro-Update-v21.apk.sha256 \
            dist/apk-manifest.json dist/upgrade-identity.json dist/install-upgrade.json \
            dist/ci-gates.json dist/v20-signature.txt dist/v21-signature.txt \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'CourtQuest Pro — verified in-place Android update v21' \
            --notes 'Install over CourtQuest Pro v20 without uninstalling or clearing data. Package com.courtquestpro and the original signing certificate match the actual v20 APK; versionCode increases from 20 to 21. A disposable Android emulator verified installation with adb install -r and preserved preferences, player data and relaunch behavior. Exact-commit native flows, development tests, lint and exact-binary comparison passed before publication. Existing UI, artwork, features and signing key are unchanged. Physical owner-phone testing remains separate. See attached verification evidence and SHA-256 checksum.'
          mkdir downloaded
          gh release download courtquest-phone-update-v21 --pattern 'CourtQuestPro-Update-v21.apk' --dir downloaded
          cmp dist/CourtQuestPro-Update-v21.apk downloaded/CourtQuestPro-Update-v21.apk
          gh release view courtquest-phone-update-v21 --json url,assets > dist/published-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courtquest-v21-publication
          path: dist/published-release.json
