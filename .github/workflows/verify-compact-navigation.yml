name: Verify compact player dock

on:
  push:
    branches: [dev/premium-flow-toolkit]
    paths:
      - '.github/workflows/verify-compact-navigation.yml'
      - 'scripts/verify_compact_navigation.py'
      - 'app/src/main/java/com/courtquestpro/CourtQuestNavigation.kt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COURTQUEST_UI_EVIDENCE: artifacts/compact-navigation
      ANDROID_AVD_HOME: /tmp/courtquest-avd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile candidate, run all units and lint
        run: |
          python3 -m unittest discover -s scripts -p 'test_android_flow_*.py' -v
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Prepare baseline and dedicated emulator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.1' 'system-images;android-35;default;x86_64' 'emulator'
          gh run download 43251979732 --name courtquest-native-library-flow --dir pinned-build9
          cp pinned-build9/app/build/outputs/apk/debug/app-debug.apk /tmp/courtquest-build9.apk
          echo '68b3b1d1f2cd08084b65973ae07544b74c2a795db27994f2b9a2b975a7785c5a  /tmp/courtquest-build9.apk' | sha256sum --check
          mkdir -p "$ANDROID_AVD_HOME" "$COURTQUEST_UI_EVIDENCE"
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --name CourtQuest_PremiumQA --package 'system-images;android-35;default;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/CourtQuest_PremiumQA.avd"
          export PATH="${ANDROID_HOME}/platform-tools:${PATH}"
          adb start-server
          "${ANDROID_HOME}/emulator/emulator" -avd CourtQuest_PremiumQA -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 > "$COURTQUEST_UI_EVIDENCE/emulator.log" 2>&1 &
          python3 - <<'PY'
          import sys,time
          sys.path.insert(0,'scripts')
          import verify_android_daily_flow as ui
          for _ in range(90):
              try:
                  if ui.shell('getprop','sys.boot_completed')=='1':break
              except Exception:pass
              time.sleep(2)
          else:raise AssertionError('QA emulator did not boot')
          assert 'CourtQuest_PremiumQA' in ui.adb('emu','avd','name').decode()
          assert 'Success' in ui.adb('install','-r','/tmp/courtquest-build9.apk',timeout=180).decode()
          ui.open_app()
          PY
      - name: Reproduce the build-9 failure before correction
        run: python3 -u scripts/verify_compact_navigation.py baseline /tmp/courtquest-build9.apk
      - name: Verify compact dock, update continuity and native smoke
        run: |
          export PATH="${ANDROID_HOME}/platform-tools:${PATH}"
          python3 -u scripts/verify_compact_navigation.py candidate app/build/outputs/apk/debug/app-debug.apk
          bash scripts/run_premium_flow_checks.sh emulator-5562 app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --build-tools "${ANDROID_HOME}/build-tools/35.0.1" --output artifacts/apk-verified
          git rev-parse HEAD HEAD:app/src > artifacts/source-revisions.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courtquest-compact-navigation
          path: |
            artifacts/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 14
