name: Prepare merge-ready CourtQuest main candidate
on:
  push:
    branches: [integration/verified-no-avatars]
    paths: ['.github/workflows/prepare-main-merge.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve merge against main in candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CourtQuest Integration Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release/avatar-free-main-candidate
          git fetch origin '+refs/heads/integration/verified-no-avatars:refs/remotes/origin/integration/verified-no-avatars'
          git merge --no-commit --no-ff -X theirs origin/integration/verified-no-avatars
          test -z "$(git ls-files -u)"
          # Preserve main's signing/version configuration but restore required app dependencies.
          git show HEAD:app/build.gradle.kts > app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          source = p.read_text()
          required = ['    implementation("com.airbnb.android:lottie-compose:6.7.1")', '    implementation("com.canopas.intro-showcase-view:introshowcaseview:2.0.2")', '    implementation("dev.chrisbanes.haze:haze:1.1.1")', '    androidTestImplementation(platform("androidx.compose:compose-bom:2024.12.01"))', '    androidTestImplementation("androidx.compose.ui:ui-test-junit4")', '    androidTestImplementation("androidx.test:runner:1.6.2")']
          marker = '    testImplementation("junit:junit:4.13.2")'
          assert source.count(marker) == 1
          source = source.replace(marker, '\\n'.join(required) + '\\n' + marker)
          p.write_text(source)
          PY
          git add app/build.gradle.kts
          test "$(grep -c 'applicationId = "com.courtquestpro"' app/build.gradle.kts)" -eq 1
          test ! -f app/src/main/java/com/courtquestpro/AvatarAppearance.kt
          test ! -f app/src/main/java/com/courtquestpro/CourtCardAthlete.kt
          if git grep -n -E 'AvatarAppearance|CourtCardAthlete|AvatarToneTransform|AvatarGeometry' -- 'app/src/main/java/com/courtquestpro/*.kt'; then exit 1; fi
          git diff --cached --stat > candidate-diff.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test merged main candidate
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee candidate-build.log
      - name: Commit and publish merge-ready branch
        run: |
          set -euo pipefail
          git commit -m "Merge verified avatar-free CourtQuest studios onto main base"
          git push --force-with-lease origin HEAD:release/avatar-free-main-candidate
      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courtquest-main-merge-candidate
          path: |
            candidate-diff.txt
            candidate-build.log
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
