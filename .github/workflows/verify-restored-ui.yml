name: Verify restored CourtQuest UI

on:
  push:
    branches:
      - dev/scorekeeper-undo-history
    paths:
      - '.github/workflows/verify-restored-ui.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Compile restored UI and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out preserved development branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify expected source branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/dev/scorekeeper-undo-history"
          grep -Fq 'private val CourtGreen = CourtQuestDesign.accentVivid' app/src/main/java/com/courtquestpro/MainActivity.kt
          grep -Fq 'val accentVivid = Color(0xFFFF650E)' app/src/main/java/com/courtquestpro/CourtQuestDesign.kt
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1"
      - name: Compile, lint and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify application package
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.1/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.courtquestpro'"
