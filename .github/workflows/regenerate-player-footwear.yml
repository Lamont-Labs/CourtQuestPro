name: Regenerate fitted player footwear assets
on:
  workflow_dispatch:
  push:
    branches: [dev/player-card-profile-v2]
    paths:
      - '.github/workflows/regenerate-player-footwear.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Rebuild and validate five-pose footwear artwork
        run: |
          set -euo pipefail
          python3 -m pip install 'Pillow==11.3.0'
          python3 tools/player-card/build_assets.py --check
          (cd tools/player-card && python3 build_premium_parts.py)
          python3 -m unittest scripts.test_player_card_artwork -v
          git diff --check
      - name: Commit regenerated production assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/assets/player_cards
          if git diff --cached --quiet; then
            echo 'No asset differences.'
          else
            git commit -m 'assets(card-studio): regenerate five-pose footwear with proportional fitting'
            git push origin HEAD:dev/player-card-profile-v2
          fi
