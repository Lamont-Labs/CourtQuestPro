name: Premium campaign - AI proposal (one bounded pass)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_refinement_proposal.py'
      - 'scripts/verify_refinement_candidate.py'
      - '.github/workflows/premium-ai-proposal.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Existing Kotlin UI file (must be <= 28 KB)'
        required: true
        default: 'app/src/main/java/com/courtquestpro/AppHeader.kt'
      phase:
        description: 'Campaign phase'
        type: choice
        required: true
        options:
          - visual-identity
          - layout-composition
          - typography
          - glass-depth
          - motion-interactions
          - consistency
          - usability
          - final-refinement
      pass_number:
        description: 'Proposed pass (1-100); not automatically accepted'
        required: true
        default: '1'
      intent:
        description: 'Specific bounded improvement goal'
        required: true
        default: 'Improve clarity while preserving existing functionality and APIs'

permissions:
  contents: read

concurrency:
  group: courtquest-ai-proposal
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Ollama and download open model
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:1.5b-instruct
      - name: Verify no-key local model inference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          data = json.dumps({"model":"qwen2.5-coder:1.5b-instruct","prompt":"Reply with OK only.","stream":False,"options":{"num_predict":12}}).encode()
          req = urllib.request.Request("http://127.0.0.1:11434/api/generate", data=data, headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req, timeout=180) as response:
              result = json.load(response)
          assert result.get("response", "").strip(), "Model produced no text"
          print("Local inference verified; no external model API key required")
          PY
      - name: Generate and validate one proposal
        env:
          TARGET: ${{ inputs.target || 'app/src/main/java/com/courtquestpro/AppHeader.kt' }}
          PHASE: ${{ inputs.phase || 'visual-identity' }}
          PASS: ${{ inputs.pass_number || '1' }}
          INTENT: ${{ inputs.intent || 'Improve premium header spacing and typographic hierarchy while preserving the AppHeader function signature and behavior' }}
        run: |
          set -euo pipefail
          mkdir -p campaign-evidence
          python3 scripts/generate_refinement_proposal.py --target "$TARGET" --phase "$PHASE" --pass-number "$PASS" --intent "$INTENT" --output campaign-evidence/proposal.json
          python3 scripts/validate_refinement_proposal.py campaign-evidence/proposal.json
      - name: Set up Java for candidate verification
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify candidate in disposable checkout
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 scripts/verify_refinement_candidate.py campaign-evidence/proposal.json --repo . --output "$RUNNER_TEMP/courtquest-candidate"
          cp "$RUNNER_TEMP/courtquest-candidate/verification.json" campaign-evidence/
          cp "$RUNNER_TEMP/courtquest-candidate/candidate.diff" campaign-evidence/
          cp "$RUNNER_TEMP/courtquest-candidate/"*.log campaign-evidence/
      - name: Build unmodified baseline APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Capture baseline and candidate on Android emulator
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -cores 2 -memory 3072
          script: |
            set -eu
            mkdir -p campaign-evidence/screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.courtquestpro
            adb shell am start -n com.courtquestpro/.MainActivity
            sleep 8
            adb exec-out screencap -p > campaign-evidence/screenshots/baseline.png
            adb shell am force-stop com.courtquestpro
            adb install -r "$RUNNER_TEMP/courtquest-candidate/candidate-debug.apk"
            adb shell pm clear com.courtquestpro
            adb shell am start -n com.courtquestpro/.MainActivity
            sleep 8
            adb exec-out screencap -p > campaign-evidence/screenshots/candidate.png
      - name: Validate captured screenshots and write evidence manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import struct

          result = {"accepted": False, "screenshots": {}}
          for name in ("baseline", "candidate"):
              p = pathlib.Path("campaign-evidence/screenshots") / (name + ".png")
              data = p.read_bytes()
              assert len(data) > 10000 and data[:8] == bytes.fromhex("89504e470d0a1a0a")
              width, height = struct.unpack(">II", data[16:24])
              assert width >= 320 and height >= 600
              result["screenshots"][name] = {
                  "width": width, "height": height,
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          result["file_hashes_equal"] = (
              result["screenshots"]["baseline"]["sha256"]
              == result["screenshots"]["candidate"]["sha256"]
          )
          pathlib.Path("campaign-evidence/screenshot-manifest.json").write_text(
              json.dumps(result, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload candidate diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: courtquest-candidate-failure-${{ github.run_id }}
          path: |
            campaign-evidence/
            ${{ runner.temp }}/courtquest-candidate/
          retention-days: 7
          if-no-files-found: warn
      - name: Upload unaccepted proposal for review
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: courtquest-verified-candidate-${{ github.run_id }}
          path: |
            campaign-evidence/
          retention-days: 30
