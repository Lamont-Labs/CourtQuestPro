name: Verify premium native visual transformation
on:
  push:
    branches: [dev/premium-flow-toolkit]
    paths:
      - 'app/src/**'
      - 'scripts/verify_premium_visuals.py'
      - '.github/workflows/verify-premium-visuals.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: premium-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ANDROID_AVD_HOME: /tmp/courtquest-avd
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile native candidate, unit tests and lint
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          python3 -m unittest discover -s scripts -p 'test_android_flow_*.py' -v
          python3 -m pip install 'Pillow==12.0.0'
      - name: Verify package, original signer and released baseline
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.1'
          python3 scripts/verify_apk.py --apk app/build/outputs/apk/debug/app-debug.apk --build-tools "${ANDROID_HOME}/build-tools/35.0.1" --output artifacts/premium-apk
          mkdir -p previous
          gh release download courtquest-phone-update-v21 --pattern CourtQuestPro-Update-v21.apk --dir previous
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Capture real before and after screens and measure compact navigation
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;default;x86_64' emulator
          mkdir -p "$ANDROID_AVD_HOME" artifacts/premium-redesign
          printf 'no\n' | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd --name CourtQuest_PremiumQA --package 'system-images;android-35;default;x86_64' --device pixel_2 --path "$ANDROID_AVD_HOME/CourtQuest_PremiumQA.avd"
          "${ANDROID_HOME}/emulator/emulator" -avd CourtQuest_PremiumQA -port 5562 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 > artifacts/premium-redesign/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 -u scripts/verify_premium_visuals.py --baseline previous/CourtQuestPro-Update-v21.apk --candidate app/build/outputs/apk/debug/app-debug.apk
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p artifacts/premium-redesign
          timeout 20 "${ANDROID_HOME}/platform-tools/adb" -s emulator-5562 logcat -d > artifacts/premium-redesign/logcat.txt 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courtquest-premium-before-after
          path: |
            artifacts/premium-redesign/
            artifacts/premium-apk/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          retention-days: 30
