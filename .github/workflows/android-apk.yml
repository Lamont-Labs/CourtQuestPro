name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build, verify, and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install pinned Android SDK packages
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1"

      - name: Prepare preserved signing identity when secrets are configured
        shell: bash
        env:
          COURTQUEST_KEYSTORE_BASE64: ${{ secrets.COURTQUEST_KEYSTORE_BASE64 }}
          COURTQUEST_STORE_PASSWORD_SECRET: ${{ secrets.COURTQUEST_SIGNING_STORE_PASSWORD }}
          COURTQUEST_KEY_ALIAS_SECRET: ${{ secrets.COURTQUEST_SIGNING_KEY_ALIAS }}
          COURTQUEST_KEY_PASSWORD_SECRET: ${{ secrets.COURTQUEST_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The existing private-repository debug key remains the fallback
          # until migration is explicitly configured and verified.
          if [[ -z "$COURTQUEST_KEYSTORE_BASE64" && -z "$COURTQUEST_STORE_PASSWORD_SECRET" && -z "$COURTQUEST_KEY_ALIAS_SECRET" && -z "$COURTQUEST_KEY_PASSWORD_SECRET" ]]; then
            echo "Signing migration not configured; retaining existing debug signing path."
            exit 0
          fi
          if [[ -z "$COURTQUEST_KEYSTORE_BASE64" || -z "$COURTQUEST_STORE_PASSWORD_SECRET" || -z "$COURTQUEST_KEY_ALIAS_SECRET" || -z "$COURTQUEST_KEY_PASSWORD_SECRET" ]]; then
            echo "::error::Incomplete signing secret set; refusing to build."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os, pathlib
          target=pathlib.Path(os.environ["RUNNER_TEMP"])/"courtquest-preserved.keystore"
          target.write_bytes(base64.b64decode(os.environ["COURTQUEST_KEYSTORE_BASE64"],validate=True))
          target.chmod(0o600)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as out:
              for key,value in (
                  ("COURTQUEST_SIGNING_KEYSTORE_PATH",str(target)),
                  ("COURTQUEST_SIGNING_STORE_PASSWORD",os.environ["COURTQUEST_STORE_PASSWORD_SECRET"]),
                  ("COURTQUEST_SIGNING_KEY_ALIAS",os.environ["COURTQUEST_KEY_ALIAS_SECRET"]),
                  ("COURTQUEST_SIGNING_KEY_PASSWORD",os.environ["COURTQUEST_KEY_PASSWORD_SECRET"]),
              ):
                  print(f"{key}<<COURTQUEST_VALUE_END",file=out)
                  print(value,file=out)
                  print("COURTQUEST_VALUE_END",file=out)
          PY
          echo "::add-mask::$COURTQUEST_STORE_PASSWORD_SECRET"
          echo "::add-mask::$COURTQUEST_KEY_PASSWORD_SECRET"
          # Compare public certificates, not key bytes. Fail closed on mismatch.
          keytool -exportcert -keystore signing/debug.keystore -alias androiddebugkey -storepass android -file "${RUNNER_TEMP}/courtquest-original.der" >/dev/null
          keytool -exportcert -keystore "${RUNNER_TEMP}/courtquest-preserved.keystore" -alias "$COURTQUEST_KEY_ALIAS_SECRET" -storepass "$COURTQUEST_STORE_PASSWORD_SECRET" -file "${RUNNER_TEMP}/courtquest-candidate.der" >/dev/null
          cmp -s "${RUNNER_TEMP}/courtquest-original.der" "${RUNNER_TEMP}/courtquest-candidate.der" || { echo "::error::Signing certificate mismatch; refusing to build."; exit 1; }

      - name: Compile and run Android lint
        run: |
          mkdir -p dist
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug :app:lintDebug 2>&1 | tee dist/gradle-build.txt

      - name: Verify installable APK and produce download files
        id: package
        run: |
          python3 scripts/verify_apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --build-tools "${ANDROID_HOME}/build-tools/35.0.1" \
            --output dist
          cp app/build/reports/lint-results-debug.html dist/
          cp app/build/reports/lint-results-debug.xml dist/

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/courtquest-preserved.keystore" "${RUNNER_TEMP}/courtquest-original.der" "${RUNNER_TEMP}/courtquest-candidate.der"

      - name: Retain APK and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CourtQuestPro-${{ steps.package.outputs.version }}-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag="android-v${APP_VERSION}-build${GITHUB_RUN_NUMBER}"
          title="CourtQuest Pro ${APP_VERSION} - Build ${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file dist/RELEASE_NOTES.md --latest
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file dist/RELEASE_NOTES.md \
              --latest
          fi
          {
            echo "## APK ready"
            echo ""
            echo "[Download CourtQuest Pro](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})"
            echo ""
            cat dist/RELEASE_NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"
