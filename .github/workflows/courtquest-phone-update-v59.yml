name: Publish visually reviewed Card Studio v59
on:
  push:
    branches: [dev/player-card-profile-v2]
    paths: ['release-request/card-studio-v59.json']
permissions:
  contents: write
  actions: read
concurrency:
  group: courtquest-phone-update-v59
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish only the frozen Android-verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=release-request/card-studio-v59.json
          run=$(jq -er .run_id "$file")
          source=$(jq -er .source "$file")
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" > run.json
          jq -e --arg s "$source" '.head_sha==$s and .head_branch=="dev/player-card-profile-v2" and .path==".github/workflows/player-card-installable.yml" and .conclusion=="success"' run.json
          git merge-base --is-ancestor "$source" "$GITHUB_SHA"
          git diff --exit-code "$source" HEAD -- app scripts tools .github/workflows/player-card-installable.yml
          gh run download "$run" -n CourtQuestPro-v59-candidate -D candidate
          gh run download "$run" -n CardStudio-v59-Android-evidence -D evidence
          (cd candidate && sha256sum -c *.apk.sha256)
          hash=$(sha256sum candidate/*.apk | cut -d' ' -f1)
          jq -e --arg s "$source" --arg h "$hash" '.status=="passed" and .commit==$s and .candidate_sha256==$h' evidence/result.json
          test "$(jq -er .apk_sha256 "$file")" = "$hash"
          jq -r .notes "$file" > notes.md
          gh release create courtquest-phone-update-v59 --target "$source" --prerelease --title 'CourtQuest Pro v59 — Card Studio' --notes-file notes.md candidate/*.apk candidate/*.sha256 evidence/result.json evidence/upgrades.json
